name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - Deployment

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # The hosted MCP endpoint lives on its own subdomain, not on VITE_API_URL.
          # This is what the "Connect to Claude" page shows the user to paste into
          # Claude; it must exactly match the MCP_RESOURCE_URI on the API and the
          # WorkOS Resource Indicator, or the audience check rejects the token.
          # Public value (it is displayed for users to copy), so it is not a secret.
          VITE_MCP_BASE_URL: https://mcp.impedo.ai

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: pcb-pilot

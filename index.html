<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#faf3e8" />
    <title>PCB Pilot — Prompt to PCB Generator</title>
    <script>
      // Resolve the theme before first paint (same rules as src/app/theme.js:
      // saved choice first, then the OS preference) so dark mode never
      // flashes the light palette while React boots.
      (function () {
        try {
          var theme = localStorage.getItem('pcb_theme');
          if (theme !== 'dark' && theme !== 'light') {
            theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
          if (theme === 'dark') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#171512');
          }
        } catch (error) {
          /* default light palette */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
